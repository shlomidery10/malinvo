# Auto-deploy the Shopify theme on every push to main.
# Requires these CI/CD variables (Settings -> CI/CD -> Variables):
#   SHOPIFY_CLI_THEME_TOKEN  = Theme Access password (masked, protected)
#   SHOPIFY_STORE            = fpevad-a6.myshopify.com
#   SHOPIFY_THEME_ID         = 169069641893
# config/settings_data.json is intentionally NOT pushed, so the live
# app-embed settings (BundleUp / Cartify / Vouch / Sense-RTL) are never overwritten.

stages:
  - deploy

deploy_to_shopify:
  stage: deploy
  image: node:22
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    CI: "true"
  script:
    - npm install -g @shopify/cli@latest
    - shopify version
    - >
      shopify theme push
      --store "$SHOPIFY_STORE"
      --theme "$SHOPIFY_THEME_ID"
      --allow-live
      --nodelete
      --ignore "config/settings_data.json"
      --force
